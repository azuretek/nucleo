name: distro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: distro-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: node distro/scripts/nucleo.mjs gate lint
      - name: only the checks we chose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api --paginate "repos/${{ github.repository }}/actions/workflows?per_page=100" --jq '.workflows[] | select(.state=="active") | .path' | grep -v '^.github/workflows/distro.yml$' || true)
          if [ -n "$active" ]; then
            echo "workflows this fork did not choose are active; the pin-and-build driver disables them at each handoff:"
            echo "$active"
            exit 1
          fi
      - name: manifest
        working-directory: distro
        run: node scripts/validate-manifest.mjs
      - name: publish scan (our own tooling)
        working-directory: distro
        run: node scripts/publish-scan.mjs
      - name: tooling unit tests
        working-directory: distro
        run: node --test scripts/*.test.mjs

  # ★ Test and build run here, on GitHub's hosted runners, like Chela and Cuate: every push to main
  # (the assembled tree, or a tooling change on it) is gated, built into the image, pushed to
  # ghcr.io and published as a dev pre-release. Pull requests run only the fast checks above.
  tests:
    if: github.event_name != 'pull_request'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NODE_COMPILE_CACHE: ${{ github.workspace }}/../.cache/nucleo/node-compile
      OPENCLAW_OXLINT_SHARD_TIMEOUT_MS: "2700000"
      OPENCLAW_BOUNDARY_DTS_TIMEOUT_MS: "1800000"
      OPENCLAW_PLUGIN_SDK_BOUNDARY_ROOT_SHIMS_TIMEOUT_MS: "1800000"
    steps:
      - name: free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: restore the node compile cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/../.cache/nucleo/node-compile
          key: node-compile-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: node-compile-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: gate (lint, then each carried patch's own tests)
        run: node distro/scripts/nucleo.mjs gate
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-logs
          path: ${{ runner.temp }}/nucleo-logs
          retention-days: 14

  build:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      NUCLEO_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - name: free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Exposes the cache service to buildx, so layers are reused between image builds.
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
      - id: build
        name: build and push the image
        run: |
          build=$(node distro/scripts/nucleo.mjs build-number)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          NUCLEO_BUILD_NUMBER="$build" node distro/scripts/nucleo.mjs build

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: publish the dev pre-release, keeping the newest ten
        env:
          GH_TOKEN: ${{ github.token }}
          NUCLEO_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          NUCLEO_BUILD_NUMBER: ${{ needs.image.outputs.build }}
        run: node distro/scripts/nucleo.mjs release-dev
      - name: keep the newest ten dev images
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55
        with:
          package-name: nucleo-gateway
          package-type: container
          min-versions-to-keep: 10
