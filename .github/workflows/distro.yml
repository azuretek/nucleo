name: distro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: only the checks we chose
        run: |
          extra=$(ls .github/workflows | grep -v "^distro.yml$" || true)
          if [ -n "$extra" ]; then
            echo "workflows this fork did not choose are present; extend the clearing patch:"
            echo "$extra"
            exit 1
          fi
      - name: manifest
        working-directory: distro
        run: node scripts/validate-manifest.mjs
      - name: publish scan (our own tooling)
        working-directory: distro
        run: node scripts/publish-scan.mjs
