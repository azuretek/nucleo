name: distro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: publish scan
        run: node scripts/publish-scan.mjs
      - name: manifest
        run: node scripts/validate-manifest.mjs
